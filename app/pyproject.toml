[project]
name = "outreach"
version = "0.1.0"
description = "Local personal outreach tracker exposed to Claude Code via MCP. Drafts only; never sends."
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
outreach = "outreach.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outreach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
